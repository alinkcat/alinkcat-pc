name: Build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
          - platform: macos-13
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'
      - name: Install frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm tauri build
      - name: Ad-hoc sign macOS app
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "Signing .app bundles..."
          find src-tauri/target -name "*.app" -type d | while read app; do
            codesign --force --deep --sign - "$app"
            echo "  signed: $app"
          done
          echo "Signing .dmg files..."
          find src-tauri/target -name "*.dmg" -type f | while read dmg; do
            codesign --force --sign - "$dmg"
            echo "  signed: $dmg"
          done
          echo "Verifying signatures..."
          find src-tauri/target -name "*.app" -type d -exec codesign --verify --verbose=2 {} \;
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
