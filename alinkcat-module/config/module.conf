# 艾联猫模块配置
# 由 App 端通过 alnkcat_helper config 或手动编辑

# 模块通信密钥（安装时随机生成，App 端通过 secret 命令获取）
MODULE_SECRET="change_me"

# 允许执行动作的应用包名（空格分隔）
ALLOWED_APPS="com.ailinkcat.mobile"

# 功能开关
ENABLE_MONITOR=1          # 深层硬件监控
ENABLE_ACTION=1           # 脚本/动作执行
ENABLE_POWER=0            # 性能调度（默认关闭，有性能风险）
ENABLE_ACCESSIBILITY=0    # 模拟操作（默认关闭）

# 监控间隔（秒）
MONITOR_INTERVAL=5