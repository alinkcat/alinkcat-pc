# alinkcat module config
# edited by the app via alnkcat_helper config, or by hand

# shared secret (generated on install, app reads it via the secret command)
MODULE_SECRET="change_me"

# package names allowed to run actions (space separated)
ALLOWED_APPS="com.ailinkcat.mobile"

# feature switches
ENABLE_MONITOR=1          # deep hw monitoring
ENABLE_ACTION=1           # script/action execution
ENABLE_POWER=0            # perf profiling (off by default, has side effects)
ENABLE_ACCESSIBILITY=0    # simulated input (off by default)

# monitor interval (seconds)
MONITOR_INTERVAL=5